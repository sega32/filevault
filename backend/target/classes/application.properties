spring.application.name=filevault

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Let Tomcat drain aborted large uploads instead of resetting the connection.
server.tomcat.max-swallow-size=-1
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# Uploads
# Parts above the threshold spool to a temp file, so heap stays flat regardless
# of upload size.
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
spring.servlet.multipart.file-size-threshold=1MB

# ---------------------------------------------------------------------------
# Database (SQLite)
# WAL mode lets readers run concurrently with the single writer; busy_timeout
# makes concurrent writers wait rather than fail with SQLITE_BUSY.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:./filevault.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.pool-name=filevault-sqlite
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema is owned by db/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------------------
# FileVault
# ---------------------------------------------------------------------------
app.storage.path=./storage
app.chunk.size=4194304

# Authentication is on by default; supply at least one key, e.g.
#   export APP_SECURITY_API_KEYS_0=$(openssl rand -hex 32)
# Startup fails if this is enabled with no keys configured.
#app.security.enabled=false
#app.security.header=X-API-Key
# app.security.api-keys[0]=
# app.security.cors-origins[0]=https://app.example.com

# AES-256-GCM encryption of chunks at rest. When enabled, app.encryption.key
# must be a base64-encoded 32-byte key: openssl rand -base64 32
app.encryption.enabled=false
# app.encryption.key=

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=filevault

logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]
logging.level.com.filevault=INFO
